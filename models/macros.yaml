macros:
  - name: macro_datediff
    inputs:
      - column
    value: " 
    {% if warehouse.DatabaseType() == \"bigquery\" %} 
        {% if !(end_time|isnil) %} 
        
            {% else %} 
                (datediff(day, date({{column}}), GETDATE()) <={{number_of_days}}) 
            {% endif %} 
        {% endif %}"
  - name: array_agg
    inputs:
      - column_name
    value: "array_agg( distinct {{column_name}})"
  - name: array_size
    inputs:
      - column_name
    value: "array_size( parse_json({{column_name}}) )"
  - name: frame_clause
    value: "frame_condition = 'rows between unbounded preceding and unbounded following'"
  - name: list_agg
    inputs:
      - column
      - delimiter
    value: " 
    {% if warehouse.DatabaseType() == \"postgres\" %}
        STRING_AGG({{column}} {% if !(delimiter|isnil) %}, '{{delimiter}}' {% endif %})
    {% else %} 
        LISTAGG({{column}} {% if !(delimiter|isnil) %}, '{{delimiter}}' {% endif %})
    {% endif %}"
