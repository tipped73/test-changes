macros:
  - name: macro_datediff
    inputs:
      - column
    value: " 
    {% if warehouse.DatabaseType() == \"bigquery\" %} 
        {% if !(end_time|isnil) %} 
            date_diff(date('{{end_time.Format(\"2006-01-02 15:04:05\")}}'), date({{column}}), day)  
        {% else %} 
            date_diff(CURRENT_DATE(), date({{column}}), day)  
        {% endif %} 
    {% elif warehouse.DatabaseType() == \"postgres\" %}
        {% if !(end_time|isnil) %} 
            date '{{end_time.Format(\"2006-01-02 15:04:05\")}}' - date({{column}}) 
        {% else %} 
            CURRENT_DATE - date({{column}}) 
        {% endif %}
    {% else %} 
        {% if !(end_time|isnil) %} 
            datediff(day, date({{column}}), date('{{end_time.Format(\"2006-01-02 15:04:05\")}}'))  
        {% else %} 
            datediff(day, date({{column}}), GETDATE()) 
        {% endif %} 
    {% endif %}"
  - name: macro_datediff_n
    inputs:
      - column
      - number_of_days
    value: " 
        {% if warehouse.DatabaseType() == \"bigquery\" %} 
            {% if !(end_time|isnil) %} 
                (date_diff(date('{{end_time.Format(\"2006-01-02 15:04:05\")}}'), date({{column}}), day) <={{number_of_days}}) 
            {% else %} 
                (date_diff(CURRENT_DATE(), date({{column}}), day) <={{number_of_days}}) 
            {% endif %} 
        {% elif warehouse.DatabaseType() == \"postgres\" %}
            {% if !(end_time|isnil) %} 
                (DATE '{{end_time.Format(\"2006-01-02 15:04:05\")}}' - date({{column}}) <={{number_of_days}})
            {% else %} 
                (CURRENT_DATE - date({{column}}) <={{number_of_days}})
            {% endif %}
        {% else %} 
            {% if !(end_time|isnil) %} 
                (datediff(day, date({{column}}), date('{{end_time.Format(\"2006-01-02 15:04:05\")}}')) <={{number_of_days}}) 
            {% else %} 
                (datediff(day, date({{column}}), GETDATE()) <={{number_of_days}}) 
            {% endif %} 
        {% endif %}"
  - name: array_agg
    inputs:
      - column_name
    value: "array_agg( distinct {{column_name}})"
  - name: array_size
    inputs:
      - column_name
    value: "array_size( parse_json({{column_name}}) )"
  - name: frame_clause
    value: "frame_condition = 'rows between unbounded preceding and unbounded following'"
  - name: list_agg
    inputs:
      - column
      - delimiter
    value: " 
    {% if warehouse.DatabaseType() == \"postgres\" %}
        STRING_AGG({{column}} {% if !(delimiter|isnil) %}, '{{delimiter}}' {% endif %})
    {% else %} 
        LISTAGG({{column}} {% if !(delimiter|isnil) %}, '{{delimiter}}' {% endif %})
    {% endif %}"
